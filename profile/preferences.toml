# Job Search — Mechanical Configuration
#
# Holds ONLY what the Rust pipeline needs at runtime: keyword filters,
# the shared location-pattern list, the minimum company grade, and the
# cleanup thresholds. Nothing preference-shaped. Taste, sectors, role
# exclusions, signals, seniority, lifestyle all live in profile/ as prose
# and are inferred by the grading skills directly (see CLAUDE.md
# "Living System Philosophy"). If you reach for a "preferred X" list here,
# stop and write prose in profile/ instead.
#
# Cardinal rule (applies to every filter below): false positives are cheap
# (AI grades them F in 30 seconds), false negatives are unrecoverable
# (a perfect job silently filtered out is lost forever). When in doubt,
# INCLUDE.

# ─────────────────────────────────────────────────────────────────
# SEARCH FILTERS
# ─────────────────────────────────────────────────────────────────

[search_filters]

# Minimum company grade to include in searches. Companies below this are
# skipped entirely (their jobs are never fetched). Valid: S / A / B / C.
min_company_grade = "C"

# Title must contain at least one of these (OR logic, case-insensitive
# substring match). A title matching NONE is dropped. Stay generic —
# tokens that occur across many roles, not job-title-specific phrases.
# Companies invent new titles constantly; broad tokens survive that drift.
#
# "Senior" was previously here but is now in exclude_keywords (742 Senior
# F/C vs 18 B+ historically — a 41:1 noise ratio).
include_keywords = [
    "Engineer", "Engineering", "Developer", "Dev", "SWE", "Software",     # core engineering
    "Systems", "System", "Infrastructure", "Infra", "Platform",           # systems/infra
    "Backend", "Back-end", "Back End",                                    # backend
    "Fullstack", "Full-stack", "Full Stack",                              # full-stack
    "ML", "Machine Learning", "AI", "Data",                               # AI/ML
    "Compiler", "Runtime", "Database", "Distributed",                     # specialist domains
    "Embedded", "Low-latency", "Performance", "HFT",
    "DevOps", "SRE", "Reliability", "Cloud",                              # ops/reliability
    "Security", "Cryptography", "Cyber",                                  # security
    "Quantitative", "Quant", "Research",                                  # quant + research
    "Deep Learning", "Neural Network", "Computer Vision",                 # AI/ML specialisms
    "NLP", "Reinforcement Learning",
    "Firmware", "Trading", "Kernel", "Protocol",                          # low-level
    "Graduate", "Grad", "Junior", "Entry", "Intern", "Internship",        # entry-level
    "Analyst",                                                            # broad catch-all
]

# Title containing any of these is removed (substring, case-insensitive).
# Exclusion runs BEFORE inclusion.
#
# Every keyword here was validated against the full graded DB (2,001 jobs
# across 434 companies). A keyword is added ONLY if it appears in ZERO B+
# jobs — i.e. a 100:1 F-to-good ratio before considering it safe. Words
# like "market" (kills QRT SS internship), "trader" (kills Old Mission A
# quant role), "operations" (kills Jane Street B role) are deliberately
# NOT excluded despite high F counts.
#
# Validation data (top exclusions, F/C count vs B+ count):
#   solutions 117/0  ·  sales 71/0  ·  executive 66/0  ·  account 54/0
#   support 38/0  ·  marketing 17/0  ·  (full data in context/notes/grading-rubric.md)
exclude_keywords = [
    "Senior", "Sr.", "Sr ", "Principal", "Staff", "Distinguished",        # seniority
    "Director", "VP", "Vice President", "Head of", "Chief", "CTO", "CIO", "Lead",
    "Manager", "Managing",                                                # management
    "Apprentice", "Placement",                                            # too-junior (different from internships)
    "Sales", "Account", "Executive", "BDR", "SDR",                        # sales / BD (0 B+ hits)
    "Business Development", "Commercial", "GTM",
    "Solutions", "Customer", "Support", "Consult",                        # customer-facing (0 B+ hits)
    "Marketing", "Communications", "Content", "Social Media",             # non-engineering (0 B+ hits)
    "Brand", "Strategist", "Evangelist",
    "Legal", "Counsel", "Paralegal", "Compliance",
    "Finance", "Tax", "Payroll", "Controller",
    "Recruit", "Talent", "People", "Onboarding",
    "Designer", "Writer", "Reporter", "Coordinator",
    "Administrator", "Procurement", "Office",
]

# Shared location patterns, applied across every ATS provider. Was per-
# provider (greenhouse / lever / ashby / workable / smartrecruiters /
# workday) but every provider matched the same UK + remote vocabulary
# case-insensitively — the per-provider split was 100% duplicated content.
# Format differences (workable "GB" vs smartrecruiters "gb") are handled
# by the shared lowercased contains() match in src/config.rs.
#
# Tier source of truth is profile/career-goals.md §Soft preferences.
# A few cities collide with US placenames (Cambridge MA, Brighton MA,
# Bath OH, Derby KS, Reading PA) — false positives are cheap per the
# cardinal rule; the grading agent filters them downstream.
[search_filters.locations]
patterns = [
    "UK", "GB", "United Kingdom", "England", "Remote",                                       # generic UK / remote markers
    "London", "Reading", "Cambridge", "Oxford", "Milton Keynes", "Brighton",                 # ↓ Tier 1 — daily-commute
    "Guildford", "Watford", "Stevenage", "Luton", "Newbury",
    "Bristol", "Bath", "Birmingham", "Coventry", "Northampton", "Sheffield",                 # ↓ Tier 2 — stretch hybrid
    "Nottingham", "Derby",
    "Edinburgh", "Glasgow",                                                                  # ↓ Tier 3 — relocation candidates
]

# ─────────────────────────────────────────────────────────────────
# CLEANUP THRESHOLDS — used by `cernio clean`
# ─────────────────────────────────────────────────────────────────

[cleanup]

# Job grades to ARCHIVE during cleanup (field is named `remove_job_grades`
# for historical reasons but the operation is archival, not deletion).
# Jobs with these grades get evaluation_status='archived' + archived_at=now
# unless they have a user decision (watching/applied/rejected). A separate
# second-phase sweep in `cernio clean` later DELETEs jobs that have been
# in the archived state for 14+ days as housekeeping.
# Valid: SS / S / A / B / C / F.
remove_job_grades = ["F", "C"]

# Job age threshold in days for the second-phase delete sweep. Archived
# jobs older than this are removed from the DB. SS and S grades are
# always kept regardless of age, as records of what companies look for.
stale_days = 14

# Company grades to archive during cleanup. Empty = cleanup does NOT
# auto-archive any companies by grade (still archivable manually).
# C-tier kept active because job grading handles quality filtering —
# a C company might still have one good role.
# Valid: S / A / B / C.
archive_company_grades = []
